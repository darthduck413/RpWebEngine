name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported and current LTS. Vite 8 needs >= 20.19.
        node: ['20.19', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # The repo ships no credentials by design. This is a cheap backstop against
  # a key sneaking back in — see CONTRIBUTING.md.
  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for credential patterns
        run: |
          if git grep -nIE \
            -e 'sk-[A-Za-z0-9_-]{20,}' \
            -e 'AIza[A-Za-z0-9_-]{30,}' \
            -e 'vck_[A-Za-z0-9]{20,}' \
            -e 'github_pat_[A-Za-z0-9_]{20,}' \
            -e 'rqsty-sk-[A-Za-z0-9+/=]{20,}' \
            -- ':!.github/workflows/ci.yml'; then
            echo "::error::A credential-shaped string is committed. Keys belong in API Settings or .env.local."
            exit 1
          fi
          echo "No credential patterns found."
